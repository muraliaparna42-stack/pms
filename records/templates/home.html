<!DOCTYPE html>
<html>
    <body>
        <h2>Student Records</h2>
        <a href="{% url 'export_csv'%}">
            <button>Export to csv</button>
        </a>
        <br><br>
        <table border="1">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
            </tr>
            {%for student in students%}
            <tr>
                <td>{{student.name}}</td>
                <td>{{student.email}}</td>
                <td>{{student.course}}</td>
            </tr>
            {% endfor%}
        </table>
    </body>
</html>
